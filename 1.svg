<svg width="1400" height="950" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 1. 核心视觉定义 (柔和阴影、现代化渐变) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F8FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>

    <!-- 区域层渐变色 -->
    <linearGradient id="layerChannel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F0F6FF;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="layerGateway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F8FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#DDF0FF;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="layerAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#F3E8FF;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="layerData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#E6F4F1;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="layerSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFEBEE;stop-opacity:0.9" />
    </linearGradient>

    <!-- 连线箭头 (正交路由专用) -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0078D4" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C2D91" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#008272" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D13438" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#E65100" />
    </marker>
  </defs>

  <!-- 第 1 层：全局背景 -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <text x="700" y="45" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#111" text-anchor="middle">蜀天信息 "统一中台、场景复用、安全可控" AI 底座架构</text>
  <line x1="400" y1="65" x2="1000" y2="65" stroke="#0078D4" stroke-width="3" stroke-linecap="round"/>

  <!-- 第 2 层：逻辑区域大框 (Zoning) -->
  
  <!-- 业务场景层 (左侧) -->
  <rect x="40" y="100" width="260" height="680" rx="15" fill="url(#layerChannel)" stroke="#B3D6FC" stroke-width="2" stroke-dasharray="6,6" />
  <text x="170" y="135" font-family="'Segoe UI', sans-serif" font-size="16" fill="#005A9E" font-weight="bold" text-anchor="middle">业务场景层 (多系统接入)</text>

  <!-- 统一网关与治理层 (中左) -->
  <rect x="330" y="100" width="260" height="680" rx="15" fill="url(#layerGateway)" stroke="#99C9FF" stroke-width="2" />
  <text x="460" y="135" font-family="'Segoe UI', sans-serif" font-size="16" fill="#0078D4" font-weight="bold" text-anchor="middle">统一 API 网关与治理层</text>

  <!-- AI 能力底座 (中右) -->
  <rect x="620" y="100" width="380" height="680" rx="15" fill="url(#layerAI)" stroke="#D8B4FE" stroke-width="2" />
  <text x="810" y="135" font-family="'Segoe UI', sans-serif" font-size="16" fill="#5C2D91" font-weight="bold" text-anchor="middle">统一 AI 能力底座</text>

  <!-- 知识与安全层 (最右) -->
  <rect x="1030" y="100" width="330" height="680" rx="15" fill="url(#layerData)" stroke="#A2E9DF" stroke-width="2" />
  <text x="1195" y="135" font-family="'Segoe UI', sans-serif" font-size="16" fill="#005E52" font-weight="bold" text-anchor="middle">企业知识与安全审核层</text>

  <!-- 身份认证层 (底部) -->
  <rect x="40" y="800" width="1320" height="100" rx="15" fill="url(#layerSec)" stroke="#E57373" stroke-width="2" />
  <text x="700" y="830" font-family="'Segoe UI', sans-serif" font-size="16" fill="#C62828" font-weight="bold" text-anchor="middle">身份鉴权与访问控制</text>

  <!-- 第 3 层：连线 (Connectors - 彻底修复冗余与穿模问题) -->
  <g id="connectors">
    <!-- 端侧到 APIM -->
    <path d="M 260 190 L 300 190 L 300 380 L 350 380" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 260 300 L 300 300 L 300 380 L 350 380" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 260 410 L 300 410 L 300 380 L 350 380" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 260 520 L 300 520 L 300 380 L 350 380" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <!-- APIM 到各类 AI 服务 (精确且唯一的两条路由线) -->
    <path d="M 570 380 L 610 380 L 610 255 L 650 255" fill="none" stroke="#5C2D91" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <path d="M 570 380 L 610 380 L 610 400 L 650 400" fill="none" stroke="#5C2D91" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

    <!-- 知识源到 AI Search (避开所有卡片的正交线路) -->
    <path d="M 260 640 L 310 640 L 310 750 L 1020 750 L 1020 260 L 1060 260" fill="none" stroke="#008272" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGreen)"/>
    
    <!-- AI 服务到 知识增强库 (RAG) -->
    <path d="M 930 255 L 990 255 L 990 260 L 1060 260" fill="none" stroke="#008272" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M 930 400 L 990 400 L 990 260 L 1060 260" fill="none" stroke="#008272" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    
    <!-- APIM 到 内容安全 (审核链路，绕开模型) -->
    <path d="M 570 380 L 610 380 L 610 585 L 1060 585" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>

    <!-- 文档解析到 AI Search (结构化提取) -->
    <path d="M 1185 380 L 1185 340" fill="none" stroke="#008272" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- 安全管控连线 (Dashed lines from bottom layer) -->
    <!-- Entra ID 统一身份管控到 APIM -->
    <path d="M 360 820 L 360 470" fill="none" stroke="#D13438" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
    <!-- Monitor 审计到 APIM -->
    <path d="M 1000 820 L 1000 770 L 460 770 L 460 470" fill="none" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- 第 4 层：服务组件卡片 (带有不透明背景 fill="#FFF"，完美覆盖底层连线) -->
  <g id="components">

    <!-- ================= Zone 1: 业务场景层 ================= -->
    <g transform="translate(60, 160)" filter="url(#shadow)">
      <rect width="200" height="60" rx="8" fill="#FFF" stroke="#0078D4" stroke-width="1.5"/>
      <text x="100" y="25" font-family="'Segoe UI', sans-serif" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">蜀天现有门户</text>
      <text x="100" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">政企知识问答入口</text>
    </g>

    <g transform="translate(60, 270)" filter="url(#shadow)">
      <rect width="200" height="60" rx="8" fill="#FFF" stroke="#0078D4" stroke-width="1.5"/>
      <text x="100" y="25" font-family="'Segoe UI', sans-serif" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">运维平台</text>
      <text x="100" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">内部运营助手</text>
    </g>

    <g transform="translate(60, 380)" filter="url(#shadow)">
      <rect width="200" height="60" rx="8" fill="#FFF" stroke="#0078D4" stroke-width="1.5"/>
      <text x="100" y="25" font-family="'Segoe UI', sans-serif" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">客户服务系统</text>
      <text x="100" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">客服辅助问答</text>
    </g>

    <g transform="translate(60, 490)" filter="url(#shadow)">
      <rect width="200" height="60" rx="8" fill="#FFF" stroke="#0078D4" stroke-width="1.5"/>
      <text x="100" y="25" font-family="'Segoe UI', sans-serif" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">移动端应用</text>
      <text x="100" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">移动端 AI 助手</text>
    </g>

    <g transform="translate(60, 600)" filter="url(#shadow)">
      <rect width="200" height="80" rx="8" fill="#FFF" stroke="#008272" stroke-width="1.5"/>
      <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="13" fill="#008272" font-weight="bold" text-anchor="middle">知识源</text>
      <text x="100" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">项目资料库 / 文档管理系统</text>
      <text x="100" y="65" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">政策文件库 / 运维知识库</text>
    </g>

    <!-- ================= Zone 2: 统一网关与编排层 ================= -->
    <g transform="translate(350, 290)" filter="url(#shadow)">
      <rect width="220" height="180" rx="10" fill="#FFF" stroke="#0078D4" stroke-width="2.5"/>
      <text x="110" y="35" font-family="'Segoe UI', sans-serif" font-size="15" fill="#0078D4" font-weight="bold" text-anchor="middle">Azure API Management</text>
      <text x="110" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">统一 AI 能力入口</text>
      <line x1="15" y1="75" x2="205" y2="75" stroke="#EEE" />
      <text x="110" y="95" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">鉴权 / 限流 / 路由</text>
      <text x="110" y="115" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">版本治理 / 调用审计</text>
      <text x="110" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D13438" text-anchor="middle">屏蔽底层模型差异</text>
      <text x="110" y="155" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D13438" text-anchor="middle">实现能力复用</text>
    </g>

    <!-- ================= Zone 3: AI 能力底座 ================= -->
    
    <!-- GPT-5.4 -->
    <g transform="translate(650, 200)" filter="url(#shadow)">
      <rect width="280" height="110" rx="8" fill="#FFF" stroke="#5C2D91" stroke-width="2.5"/>
      <text x="140" y="30" font-family="'Segoe UI', sans-serif" font-size="15" fill="#5C2D91" font-weight="bold" text-anchor="middle">Azure OpenAI (GPT-5.4)</text>
      <rect x="80" y="40" width="120" height="20" rx="4" fill="#F3E8FF"/>
      <text x="140" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#5C2D91" font-weight="bold" text-anchor="middle">核心通用推理模型</text>
      <text x="140" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#333" text-anchor="middle">政企知识问答 / 项目方案生成</text>
      <text x="140" y="95" font-family="'Segoe UI', sans-serif" font-size="11" fill="#333" text-anchor="middle">运营报告撰写 / 复杂业务咨询</text>
    </g>

    <!-- GPT-5.4-mini -->
    <g transform="translate(650, 350)" filter="url(#shadow)">
      <rect width="280" height="100" rx="8" fill="#FFF" stroke="#8661C5" stroke-width="1.5"/>
      <text x="140" y="30" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8661C5" font-weight="bold" text-anchor="middle">Azure OpenAI (GPT-5.4-mini)</text>
      <rect x="80" y="40" width="120" height="20" rx="4" fill="#F3E8FF"/>
      <text x="140" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#5C2D91" font-weight="bold" text-anchor="middle">高频轻量交互模型</text>
      <text x="140" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#333" text-anchor="middle">客服辅助 / 资料摘要</text>
      <text x="140" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">内部办公助手请求</text>
    </g>

    <!-- ================= Zone 4: 知识与安全层 ================= -->
    
    <!-- AI Search (RAG) -->
    <g transform="translate(1060, 180)" filter="url(#shadow)">
      <rect width="250" height="160" rx="10" fill="#FFF" stroke="#008272" stroke-width="2.5"/>
      <text x="125" y="35" font-family="'Segoe UI', sans-serif" font-size="16" fill="#008272" font-weight="bold" text-anchor="middle">Azure AI Search (RAG)</text>
      <text x="125" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">统一知识索引 (Standard S1)</text>
      <line x1="20" y1="75" x2="230" y2="75" stroke="#EEE" />
      <text x="125" y="95" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">项目文档、产品资料、运维手册</text>
      <text x="125" y="115" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">为 RAG 提供精准上下文</text>
      <text x="125" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#008272" font-weight="bold" text-anchor="middle">提升回答准确性与可追溯性</text>
    </g>

    <!-- Document Intelligence -->
    <g transform="translate(1060, 380)" filter="url(#shadow)">
      <rect width="250" height="120" rx="10" fill="#FFF" stroke="#0078D4" stroke-width="2"/>
      <text x="125" y="30" font-family="'Segoe UI', sans-serif" font-size="15" fill="#0078D4" font-weight="bold" text-anchor="middle">Azure Document Intelligence</text>
      <text x="125" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">文档智能解析 (Standard S0)</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#EEE" />
      <text x="125" y="85" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">解析合同、标书、会议纪要</text>
      <text x="125" y="105" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">业务申请表单，提取结构化字段</text>
    </g>

    <!-- Content Safety -->
    <g transform="translate(1060, 540)" filter="url(#shadow)">
      <rect width="250" height="90" rx="10" fill="#FFF" stroke="#D13438" stroke-width="2"/>
      <text x="125" y="30" font-family="'Segoe UI', sans-serif" font-size="15" fill="#D13438" font-weight="bold" text-anchor="middle">Azure AI Content Safety</text>
      <text x="125" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">内容安全检测 (Standard)</text>
      <text x="125" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">降低违规内容传播与审核遗漏风险</text>
    </g>

    <!-- ================= Zone 5: Security & Control ================= -->
    <g transform="translate(180, 820)" filter="url(#shadow)">
      <rect width="360" height="60" rx="8" fill="#FFF" stroke="#D13438" stroke-width="2"/>
      <text x="180" y="25" font-family="'Segoe UI', sans-serif" font-size="14" fill="#D13438" font-weight="bold" text-anchor="middle">Entra ID 与托管标识</text>
      <text x="180" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">统一用户角色与应用访问权限，实现无密钥安全认证</text>
    </g>

    <g transform="translate(800, 820)" filter="url(#shadow)">
      <rect width="400" height="60" rx="8" fill="#FFF" stroke="#E65100" stroke-width="2"/>
      <text x="200" y="25" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle">Azure Monitor (审计与留痕)</text>
      <text x="200" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666" text-anchor="middle">记录模型调用、知识检索和接口访问，支撑问题追踪与合规审查</text>
    </g>

  </g>
</svg>